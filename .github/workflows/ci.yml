name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Type-aware lint needs Astro's generated types (.astro/), absent in a fresh checkout.
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run build

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Order matters: build first, then migrate the DB, then deploy code that depends on the new schema.
      - run: npm run build
      # SUPABASE_DB_PASSWORD in env keeps link/db push non-interactive.
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: npx supabase db push --yes
      # No --config: astro build writes dist/server/wrangler.json, found via .wrangler/deploy/config.json.
      - run: npx wrangler deploy
